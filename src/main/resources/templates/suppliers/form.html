<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Supplier Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('suppliers')}"></div>

<main class="container py-5">
    <div class="card border-0 shadow-sm mx-auto product-form-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4" th:text="${pageTitle}">Supplier Form</h1>
            <form th:object="${supplier}"
                  th:action="${supplier.id == null} ? @{/suppliers} : @{/suppliers/update/{id}(id=${supplier.id})}"
                  method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="supplierCode">Supplier Code</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('supplierCode')} ? 'is-invalid'"
                               id="supplierCode" type="text" th:field="*{supplierCode}" maxlength="50" required autofocus>
                        <div class="invalid-feedback" th:errors="*{supplierCode}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="name">Supplier Name</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               id="name" type="text" th:field="*{name}" maxlength="150" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="contactPerson">Contact Person</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('contactPerson')} ? 'is-invalid'"
                               id="contactPerson" type="text" th:field="*{contactPerson}" maxlength="150">
                        <div class="invalid-feedback" th:errors="*{contactPerson}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="phone">Phone</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               id="phone" type="text" th:field="*{phone}" maxlength="20" required>
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               id="email" type="email" th:field="*{email}" maxlength="150">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                                id="status" th:field="*{status}" required>
                            <option value="">Select a status</option>
                            <option th:each="statusOption : ${statuses}" th:value="${statusOption}"
                                    th:text="${statusOption}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{status}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="address">Address</label>
                        <textarea class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                                  id="address" th:field="*{address}" maxlength="500" rows="3"></textarea>
                        <div class="invalid-feedback" th:errors="*{address}"></div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
