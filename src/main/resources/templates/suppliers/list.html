<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supplier Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('suppliers')}"></div>

<main class="container-fluid page-container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Supplier Management</h1>
            <p class="text-secondary mb-0">Maintain supplier contact details and status.</p>
        </div>
        <a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','PURCHASING_OFFICER')" th:href="@{/suppliers/new}">Add Supplier</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/suppliers}">
        <div class="col-sm-8 col-md-5">
            <label class="visually-hidden" for="keyword">Search suppliers</label>
            <input class="form-control" id="keyword" name="keyword" th:value="${keyword}"
                   placeholder="Search code, name, contact, phone, or email">
        </div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Search</button></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/suppliers}">Clear</a></div>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Supplier Code</th>
                    <th>Supplier Name</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th class="text-end" sec:authorize="hasAnyRole('ADMIN','PURCHASING_OFFICER')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="supplier : ${suppliers}">
                    <td class="fw-semibold" th:text="${supplier.supplierCode}"></td>
                    <td th:text="${supplier.name}"></td>
                    <td th:text="${#strings.isEmpty(supplier.contactPerson) ? '—' : supplier.contactPerson}"></td>
                    <td th:text="${supplier.phone}"></td>
                    <td th:text="${#strings.isEmpty(supplier.email) ? '—' : supplier.email}"></td>
                    <td><span class="badge" th:classappend="${supplier.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${supplier.status}"></span></td>
                    <td class="text-end text-nowrap" sec:authorize="hasAnyRole('ADMIN','PURCHASING_OFFICER')">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/suppliers/edit/{id}(id=${supplier.id})}">Edit</a>
                        <form class="d-inline" method="post" th:action="@{/suppliers/delete/{id}(id=${supplier.id})}"
                              onsubmit="return confirm('Delete this supplier?')"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(suppliers)}">
                    <td colspan="7" class="text-center text-secondary py-5">No suppliers found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
