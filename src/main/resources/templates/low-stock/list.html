<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Low Stock Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Stock Management</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/categories}">Categories</a>
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/suppliers}">Suppliers</a>
            <a class="nav-link" th:href="@{/stock-in}">Stock-In</a>
            <a class="nav-link" th:href="@{/stock-out}">Stock-Out</a>
            <a class="nav-link active" th:href="@{/low-stock}">Low Stock</a>
        </div>
    </div>
</nav>

<main class="container-fluid page-container py-5">
    <div class="mb-4">
        <h1 class="h2 mb-1">Low Stock Alerts</h1>
        <p class="text-secondary mb-0">
            Products Requiring Attention: <strong th:text="${lowStockCount}">0</strong>
        </p>
    </div>

    <div class="alert alert-warning" role="alert" th:if="${lowStockCount > 0}"
         th:text="|${lowStockCount} products have reached or fallen below their reorder level.|"></div>
    <div class="alert alert-success" role="alert" th:if="${lowStockCount == 0}">
        All products currently have sufficient stock.
    </div>

    <div class="card border-0 shadow-sm" th:if="${lowStockCount > 0}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Product Code</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Current Quantity</th>
                    <th>Reorder Level</th>
                    <th>Stock Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td class="fw-semibold" th:text="${product.productCode}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.category.name}"></td>
                    <td th:text="${product.quantity}"></td>
                    <td th:text="${product.reorderLevel}"></td>
                    <td>
                        <span class="badge text-bg-danger" th:if="${product.quantity == 0}">OUT OF STOCK</span>
                        <span class="badge text-bg-warning" th:if="${product.quantity > 0}">LOW STOCK</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-primary"
                           th:href="@{/stock-in/new(productId=${product.id})}">Add Stock</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
