<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body><div th:replace="~{fragments/navigation :: navigation('users')}"></div><main class="container py-5"><div class="card border-0 shadow-sm mx-auto" style="max-width: 560px"><div class="card-body p-4"><h1 class="h3 mb-1">Reset Password</h1><p class="text-secondary" th:text="${'User: ' + user.username}"></p><form method="post" th:object="${passwordForm}" th:action="@{/users/password/{id}(id=${user.id})}"><label class="form-label" for="password">New Password</label><input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" type="password" th:field="*{password}" minlength="8" maxlength="72" required autocomplete="new-password"><div class="invalid-feedback" th:errors="*{password}"></div><div class="form-text">8 to 72 characters.</div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Reset Password</button><a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a></div></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
