<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">User</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body><div th:replace="~{fragments/navigation :: navigation('users')}"></div><main class="container py-5"><div class="card border-0 shadow-sm mx-auto" style="max-width: 760px"><div class="card-body p-4"><h1 class="h3 mb-4" th:text="${pageTitle}">User</h1>
<form method="post" th:object="${userForm}" th:action="${userForm.id == null} ? @{/users} : @{/users/update/{id}(id=${userForm.id})}">
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
    <div class="row g-3"><div class="col-md-6"><label class="form-label" for="username">Username</label><input class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" id="username" th:field="*{username}" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" title="Use letters, numbers, dots, hyphens, or underscores." required><div class="invalid-feedback" th:errors="*{username}"></div></div>
    <div class="col-md-6"><label class="form-label" for="fullName">Full Name</label><input class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" id="fullName" th:field="*{fullName}" maxlength="150" required><div class="invalid-feedback" th:errors="*{fullName}"></div></div>
    <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" type="email" th:field="*{email}" maxlength="150"><div class="invalid-feedback" th:errors="*{email}"></div></div>
    <div class="col-md-6"><label class="form-label" for="role">Role</label><select class="form-select" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'" id="role" th:field="*{role}" required><option value="">Select a role</option><option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option></select><div class="invalid-feedback" th:errors="*{role}"></div></div>
    <div class="col-12" th:if="${userForm.id == null}"><label class="form-label" for="password">Password</label><input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="password" type="password" th:field="*{password}" minlength="8" maxlength="72" required autocomplete="new-password"><div class="invalid-feedback" th:errors="*{password}"></div><div class="form-text">8 to 72 characters.</div></div>
    <div class="col-12"><div class="form-check"><input class="form-check-input" id="active" type="checkbox" th:field="*{active}"><label class="form-check-label" for="active">Active account</label></div></div></div>
    <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Save User</button><a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a></div>
</form></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
