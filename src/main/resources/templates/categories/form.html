<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Category Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('categories')}"></div>

<main class="container py-5">
    <div class="form-card card border-0 shadow-sm mx-auto">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4" th:text="${pageTitle}">Category Form</h1>
            <form th:object="${category}"
                  th:action="${category.id == null} ? @{/categories} : @{/categories/update/{id}(id=${category.id})}"
                  method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="name">Category Name</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           id="name" type="text" th:field="*{name}" maxlength="100" required autofocus>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                              id="description" th:field="*{description}" maxlength="500" rows="4"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/categories}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
