<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Current Stock Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('reports')}"></div>
<main class="container-fluid page-container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2 mb-0">Current Stock Report</h1><a class="btn btn-success" th:href="@{/reports/current-stock/download}">Download CSV</a></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Product Code</th><th>Product Name</th><th>Category</th><th>Current Quantity</th><th>Reorder Level</th><th>Unit Price</th><th>Stock Status</th></tr></thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td class="fw-semibold" th:text="${product.productCode}"></td><td th:text="${product.name}"></td><td th:text="${product.category.name}"></td>
            <td th:text="${product.quantity}"></td><td th:text="${product.reorderLevel}"></td><td th:text="${#numbers.formatDecimal(product.unitPrice, 1, 2)}"></td>
            <td><span class="badge text-bg-danger" th:if="${product.quantity == 0}">OUT OF STOCK</span><span class="badge text-bg-warning" th:if="${product.quantity > 0 and product.quantity <= product.reorderLevel}">LOW STOCK</span><span class="badge text-bg-success" th:if="${product.quantity > product.reorderLevel}">IN STOCK</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}"><td colspan="7" class="text-center text-secondary py-5">No products found.</td></tr>
        </tbody>
    </table></div></div>
</main>
</body>
</html>
