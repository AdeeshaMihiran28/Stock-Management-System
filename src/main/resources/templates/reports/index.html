<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('reports')}"></div>
<main class="container py-5">
    <div class="mb-4"><h1 class="h2 mb-1">Reports</h1><p class="text-secondary">View current inventory and stock movement reports.</p></div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4"><div class="card module-card h-100 border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Current Stock Report</h2><a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/current-stock}">View Report</a></div></div></div>
        <div class="col-md-6 col-lg-4"><div class="card module-card h-100 border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Stock-In Report</h2><a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/stock-in}">View Report</a></div></div></div>
        <div class="col-md-6 col-lg-4"><div class="card module-card h-100 border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Stock-Out Report</h2><a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/stock-out}">View Report</a></div></div></div>
        <div class="col-md-6 col-lg-4"><div class="card module-card h-100 border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Low Stock Report</h2><a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/low-stock}">View Report</a></div></div></div>
        <div class="col-md-6 col-lg-4"><div class="card module-card h-100 border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Stock Movement Report</h2><a class="btn btn-primary btn-sm mt-2" th:href="@{/reports/movements}">View Report</a></div></div></div>
    </div>
</main>
</body>
</html>
