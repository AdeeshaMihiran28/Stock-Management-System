<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock-In Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation('stock-in')}"></div>

<main class="container-fluid page-container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Stock-In Management</h1>
            <p class="text-secondary mb-0">History of stock received from suppliers.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/stock-in/new}">Add Stock-In</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Transaction ID</th>
                    <th>Date</th>
                    <th>Product Code</th>
                    <th>Product Name</th>
                    <th>Supplier</th>
                    <th>Stocked In</th>
                    <th>Current Available</th>
                    <th>Reference Number</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.id}"></td>
                    <td th:text="${#temporals.format(transaction.transactionDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td class="fw-semibold" th:text="${transaction.product.productCode}"></td>
                    <td th:text="${transaction.product.name}"></td>
                    <td th:text="${transaction.supplier.supplierCode + ' - ' + transaction.supplier.name}"></td>
                    <td th:text="${transaction.quantity}"></td>
                    <td class="fw-semibold" th:text="${transaction.product.quantity}"></td>
                    <td th:text="${#strings.isEmpty(transaction.referenceNumber) ? '-' : transaction.referenceNumber}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="8" class="text-center text-secondary py-5">No Stock-In transactions found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
